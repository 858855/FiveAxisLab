[mcu]
serial: /tmp/fiveaxis-batch-mcu

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 500

[stepper_x]
step_pin: gpio0
dir_pin: gpio1
microsteps: 16
rotation_distance: 40
endstop_pin: gpio2
position_endstop: 0
homing_positive_dir: false
position_min: -200
position_max: 300

[stepper_y]
step_pin: gpio3
dir_pin: gpio4
microsteps: 16
rotation_distance: 40
endstop_pin: gpio5
position_endstop: 0
homing_positive_dir: false
position_min: -200
position_max: 300

[stepper_z]
step_pin: gpio6
dir_pin: gpio7
microsteps: 16
rotation_distance: 8
endstop_pin: gpio8
position_endstop: 0
homing_positive_dir: false
position_min: -200
position_max: 300

[extruder]
step_pin: gpio9
dir_pin: gpio10
microsteps: 16
rotation_distance: 33
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio11
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
control: watermark
min_temp: 0
max_temp: 400
min_extrude_temp: 0

[manual_stepper rotary_a]
step_pin: gpio12
dir_pin: gpio13
microsteps: 16
rotation_distance: 360
velocity: 30
accel: 60

[manual_stepper rotary_b]
step_pin: gpio14
dir_pin: gpio15
microsteps: 16
rotation_distance: 360
velocity: 30
accel: 60

[force_move]
enable_force_move: True


